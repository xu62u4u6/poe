const ITEMS=JSON.parse(document.querySelector('#part-data').textContent);

const selected={},versions={};let activeSlot='head',activeTag='',query='',limit=16,currentView='list';const browsing=Object.fromEntries(SLOTS.map(([slot])=>[slot,{query:'',tag:'',limit:16,scroll:0,filtersOpen:innerWidth>=800}]));let configScroll=0;

function renderResults(){const list=ITEMS.filter(i=>i.slot===activeSlot&&(!activeTag||i.tags.includes(activeTag))&&(!query||[i.name,i.primary,t(i.primary),...i.tags,...i.tags.map(t),...i.variants.flatMap(v=>[v.text,v.zh])].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||a.name.localeCompare(b.name));$('#result-count').textContent=language==='zh-Hant'?`${list.length} 個部件`:`${list.length} ${list.length===1?'part':'parts'}`;
if(!list.length){$('#results').innerHTML=`<div class="empty"><p>${t('No matching parts')}</p><button type="button" class="text-button" id="reset-filters">${t('Reset filters')}</button></div>`;$('#reset-filters').onclick=()=>{activeTag='';query='';$('#search').value='';renderFilters();renderResults()};return}
$('#results').innerHTML=list.slice(0,limit).map(i=>`<article class="part" data-id="${i.id}"><header class="part-header"><span class="category-icon" role="img" aria-label="${esc(t(i.primary))}">${icon(i.primary)}</span><div><h3>${esc(i.name)}</h3></div></header><div class="variants">${[...i.variants].sort((a,b)=>(RANK[a.key]??9)-(RANK[b.key]??9)).map(v=>{const on=selected[i.slot]===i.id&&versions[i.id]===v.key;return `<div class="variant" data-tier="${esc(v.key)}" data-selected="${on}" ${['Uber','Queen'].includes(v.key)?'data-special="true"':''}><span class="tier">${esc(t(TYPES[v.key]||v.key))}</span><p class="modifier">${esc(modifierText(v))}</p><button type="button" class="choose-state" data-choose="${i.id}" data-key="${esc(v.key)}" aria-label="${t(on?'Deselect':'Select')} ${esc(i.name)} ${esc(t(TYPES[v.key]||v.key))}" aria-pressed="${on}">${t(on?'Selected':'Select')}</button></div>`}).join('')}</div></article>`).join('')+(list.length>limit?`<button type="button" class="more" id="show-more">${t('Show more parts')}</button>`:'');

function setSlot(slot){if(slot===activeSlot&&currentView==='list')return;rememberPosition();activeSlot=slot;currentView='list';document.body.dataset.view='list';const state=browsing[slot];activeTag=state.tag;query=state.query;limit=state.limit;$('#search').value=query;$('#filters').hidden=!state.filtersOpen;renderTabs();renderFilters();renderResults();renderNavigation();restorePosition()}
function choose(id,key){const item=ITEMS.find(i=>i.id===id);const remove=selected[item.slot]===id&&versions[id]===key;if(remove)delete selected[item.slot];else{selected[item.slot]=id;versions[id]=key}renderSummary();renderResults();document.querySelector(`[data-choose="${id}"][data-key="${key}"]`)?.focus({preventScroll:true});$('#announcement').textContent=t(remove?'Deselected':'Selected')+' '+item.name+' '+t(TYPES[key]);}

$('#language-toggle').onclick=()=>{const y=scrollY;language=language==='en'?'zh-Hant':'en';try{localStorage.setItem('wickerman-language',language)}catch{}renderLanguage();const url=new URL(location.href);url.searchParams.set('lang',language);history.replaceState(null,'',url);window.scrollTo({top:y,behavior:'instant'})};$('#filters').hidden=innerWidth<800;renderLanguage();
