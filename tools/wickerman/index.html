'use strict';
const ZH={"Damage":"傷害","Physical":"物理","Movement":"位移","Cooldowns":"冷卻","Corpses":"屍體","Rage":"盛怒","Area":"範圍","Flasks":"藥劑","Loot":"掉落","Warcries":"戰吼","Utility":"功能","Author: Dion":"作者：Dion","Head": "頭部", "Torso": "軀幹", "Upper Limb": "上肢", "Lower Limb": "下肢", "Loadout": "配置", "Clear": "清空", "Search parts or effects": "搜尋部件或效果", "Filter": "篩選", "Slots and loadout": "部位與配置", "Parts": "部件清單", "Slots": "部位", "Categories": "分類", "Source:": "資訊來自", "PoEDB": "流亡編年史", "Low": "低階", "Med": "中階", "High": "高階", "Base": "基本", "High 1": "高 1", "High 2": "高 2", "High 3": "高 3", "Select": "選用", "Selected": "已選", "Deselect": "取消", "Deselected": "已取消", "Choose a part": "選擇部件", "Choose ": "選擇", "Remove ": "移除", "Removed ": "已移除", "No matching parts": "沒有符合的部件", "Reset filters": "清除篩選", "Show more parts": "顯示更多部件", "Loadout cleared": "已清空配置", "Minions": "召喚", "Totems": "圖騰", "Spells": "法術", "Attacks": "攻擊", "Lightning": "閃電", "Fire": "火焰", "Cold": "冰冷", "Chaos": "混沌", "Energy Shield": "能盾", "Mana": "魔力", "Life": "生命", "Attributes": "屬性", "Defence": "防禦", "Recovery": "回復", "Speed": "速度", "Charges": "充能", "Other": "其他", "Curses": "咒術", "Projectiles": "投射物", "Ailments": "異常狀態", "All": "全部"};
let language='en';try{if(localStorage.getItem('wickerman-language')==='zh-Hant')language='zh-Hant'}catch{}
function t(text){return language==='zh-Hant'?(ZH[text]??text):text}

const ITEMS=JSON.parse(document.querySelector('#part-data').textContent);
const SLOTS=[['head','Head'],['torso','Torso'],['arm','Upper Limb'],['leg','Lower Limb']];
const ICONS={'Minions':'summon','Totems':'totem','Spells':'spell','Attacks':'attack','Lightning':'lightning','Fire':'fire','Cold':'cold','Chaos':'chaos','Energy Shield':'shield','Mana':'mana','Life':'life','Attributes':'attribute','Defence':'shield','Recovery':'life','Speed':'speed','Damage':'attack','Physical':'attack','Movement':'speed','Cooldowns':'clock','Corpses':'summon','Rage':'rage','Area':'area','Flasks':'flask','Loot':'loot','Warcries':'warcry','Utility':'utility'};
const TYPES={Low:'Low',Med:'Med',High:'High',Base:'Base',Queen:'Queen',Uber:'Uber',High1:'High 1',High2:'High 2',High3:'High 3','1':'1','2':'2','3':'3'};
const RANK={High:0,High1:0,High2:1,High3:2,Med:3,Low:4,Base:0,'1':0,'2':1,'3':2,Queen:5,Uber:6};
const selected={},versions={};let activeSlot='head',activeTag='',query='',limit=16,currentView='list';const browsing=Object.fromEntries(SLOTS.map(([slot])=>[slot,{query:'',tag:'',limit:16,scroll:0,filtersOpen:innerWidth>=800}]));let configScroll=0;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(tag,cls=''){return `<svg class="${cls}" aria-hidden="true"><use href="#i-${ICONS[tag]||(['head','torso','arm','leg','close'].includes(tag)?tag:'generic')}"/></svg>`}
function version(item){return item.variants.find(v=>v.key===versions[item.id])||item.variants[0]}
function rememberPosition(){if(currentView==='list')browsing[activeSlot]={query,tag:activeTag,limit,scroll:scrollY,filtersOpen:!$('#filters').hidden};else configScroll=scrollY}
function restorePosition(){window.scrollTo({top:currentView==='list'?browsing[activeSlot].scroll:configScroll,behavior:'instant'})}
function setView(view){if(currentView===view)return;rememberPosition();currentView=view;document.body.dataset.view=view;renderNavigation();if(innerWidth<800)restorePosition()}
function renderNavigation(){$('#bottom-nav').innerHTML=[...SLOTS,['config','Loadout']].map(([key,label])=>`<button type="button" data-nav="${key}" ${((key==='config'&&currentView==='config')||(key===activeSlot&&currentView==='list'))?'aria-current="page"':''}>${t(label)}${key==='config'?`<span class="nav-count">${Object.keys(selected).length}/4</span>`:''}</button>`).join('');$('#bottom-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='config')setView('config');else setSlot(b.dataset.nav)})}
function renderSummary(){let count=0;$('#slots').innerHTML=SLOTS.map(([slot,label])=>{const item=ITEMS.find(i=>i.id===selected[slot]);if(item)count++;return `<div class="slot-row ${item?'has-item':''}"><div class="slot"><span class="slot-icon">${icon(item?item.primary:slot)}</span><div><button type="button" class="slot-label slot-edit" data-slot="${slot}" aria-label="${t('Choose ')}${t(label)}">${t(label)}${item?' · '+esc(t(TYPES[version(item).key]||version(item).key)):''}</button><p class="effect">${esc(item?version(item).text:t('Choose ')+t(label))}</p>${item?`<span class="item-name">${esc(item.name)}</span>`:''}</div></div>${item?`<button type="button" class="remove-slot" data-remove="${slot}" aria-label="${t('Remove ')}${t(label)}">${icon('close')}</button>`:''}</div>`}).join('');$('#selected-count').textContent=`${count} / 4`;renderNavigation();$('#clear-all').disabled=!count;
$('#slots').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{setSlot(b.dataset.slot);if(innerWidth>=800)$('#picker').scrollIntoView({block:'start',behavior:'instant'})});$('#slots').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const slot=b.dataset.remove;delete selected[slot];renderSummary();renderResults();$('#announcement').textContent=t('Removed ')+t(SLOTS.find(([s])=>s===slot)[1]);document.querySelector(`[data-slot="${slot}"]`).focus({preventScroll:true})});}
function renderTabs(){$('#tabs').innerHTML=SLOTS.map(([s,l])=>`<button type="button" data-tab="${s}" aria-pressed="${s===activeSlot}">${t(l)}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setSlot(b.dataset.tab));}
function renderFilters(){updateFilterButton();const tags=[...new Set(ITEMS.filter(i=>i.slot===activeSlot).flatMap(i=>i.tags))];const order=['Minions','Spells','Attacks','Lightning','Fire','Cold','Chaos','Life','Energy Shield','Mana','Attributes','Defence','Recovery','Speed','Totems','Damage','Physical','Movement','Cooldowns','Corpses','Rage','Area','Flasks','Loot','Warcries','Utility'];tags.sort((a,b)=>(order.includes(a)?order.indexOf(a):99)-(order.includes(b)?order.indexOf(b):99));$('#filters').innerHTML=['',...tags].map(tag=>`<button type="button" data-tag="${tag}" aria-pressed="${tag===activeTag}">${tag?icon(tag):''}${t(tag||'All')}</button>`).join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTag=b.dataset.tag;limit=16;renderFilters();renderResults();$(`[data-tag="${activeTag}"]`).focus({preventScroll:true})})}
function renderResults(){const list=ITEMS.filter(i=>i.slot===activeSlot&&(!activeTag||i.tags.includes(activeTag))&&(!query||[i.name,i.primary,t(i.primary),...i.tags,...i.tags.map(t),...i.variants.map(v=>v.text)].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||a.name.localeCompare(b.name));$('#result-count').textContent=language==='zh-Hant'?`${list.length} 個部件`:`${list.length} ${list.length===1?'part':'parts'}`;
if(!list.length){$('#results').innerHTML=`<div class="empty"><p>${t('No matching parts')}</p><button type="button" class="text-button" id="reset-filters">${t('Reset filters')}</button></div>`;$('#reset-filters').onclick=()=>{activeTag='';query='';$('#search').value='';renderFilters();renderResults()};return}
$('#results').innerHTML=list.slice(0,limit).map(i=>`<article class="part" data-id="${i.id}"><header class="part-header"><span class="category-icon" role="img" aria-label="${esc(t(i.primary))}">${icon(i.primary)}</span><div><h3>${esc(i.name)}</h3></div></header><div class="variants">${[...i.variants].sort((a,b)=>(RANK[a.key]??9)-(RANK[b.key]??9)).map(v=>{const on=selected[i.slot]===i.id&&versions[i.id]===v.key;return `<div class="variant" data-tier="${esc(v.key)}" data-selected="${on}" ${['Uber','Queen'].includes(v.key)?'data-special="true"':''}><span class="tier">${esc(t(TYPES[v.key]||v.key))}</span><p class="modifier">${esc(v.text)}</p><button type="button" class="choose-state" data-choose="${i.id}" data-key="${esc(v.key)}" aria-label="${t(on?'Deselect':'Select')} ${esc(i.name)} ${esc(t(TYPES[v.key]||v.key))}" aria-pressed="${on}">${t(on?'Selected':'Select')}</button></div>`}).join('')}</div></article>`).join('')+(list.length>limit?`<button type="button" class="more" id="show-more">${t('Show more parts')}</button>`:'');
$('#results').querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choose),b.dataset.key));if($('#show-more'))$('#show-more').onclick=()=>{const next=limit;limit+=16;renderResults();document.querySelectorAll('.part')[next]?.querySelector('[data-choose]')?.focus({preventScroll:true})};}
function updateFilterButton(){$('#filter-count').textContent=activeTag?' · '+t(activeTag):'';$('#filter-toggle').setAttribute('aria-expanded',String(!$('#filters').hidden))}
function setSlot(slot){if(slot===activeSlot&&currentView==='list')return;rememberPosition();activeSlot=slot;currentView='list';document.body.dataset.view='list';const state=browsing[slot];activeTag=state.tag;query=state.query;limit=state.limit;$('#search').value=query;$('#filters').hidden=!state.filtersOpen;renderTabs();renderFilters();renderResults();renderNavigation();restorePosition()}
function choose(id,key){const item=ITEMS.find(i=>i.id===id);const remove=selected[item.slot]===id&&versions[id]===key;if(remove)delete selected[item.slot];else{selected[item.slot]=id;versions[id]=key}renderSummary();renderResults();document.querySelector(`[data-choose="${id}"][data-key="${key}"]`)?.focus({preventScroll:true});$('#announcement').textContent=t(remove?'Deselected':'Selected')+' '+item.name+' '+t(TYPES[key]);}
$('#search').oninput=e=>{query=e.target.value;limit=16;renderResults()};$('#filter-toggle').onclick=()=>{$('#filters').hidden=!$('#filters').hidden;updateFilterButton()};$('#clear-all').onclick=()=>{for(const key of Object.keys(selected))delete selected[key];renderSummary();renderResults();$('#announcement').textContent=t('Loadout cleared');(innerWidth<800?document.querySelector('[data-nav="config"]'):document.querySelector('[data-slot]')).focus({preventScroll:true})};function renderLanguage(){document.documentElement.lang=language;$('#loadout-label').textContent=t('Loadout');$('#clear-all').textContent=t('Clear');$('#search').placeholder=t('Search parts or effects');$('#search').setAttribute('aria-label',t('Search parts or effects'));$('#filter-toggle').firstChild.nodeValue=t('Filter');$('#bottom-nav').setAttribute('aria-label',t('Slots and loadout'));$('#picker').setAttribute('aria-label',t('Parts'));$('#configuration').setAttribute('aria-label',t('Loadout'));$('#tabs').setAttribute('aria-label',t('Slots'));$('#filters').setAttribute('aria-label',t('Categories'));$('#source-label').textContent=t('Source:');$('#source-link').textContent=t('PoEDB');$('#author-label').textContent=t('Author: Dion');const target=language==='en'?'Switch to Traditional Chinese':'切換為英文';$('#language-toggle').setAttribute('aria-label',target);$('#language-toggle').title=target;renderSummary();renderTabs();renderFilters();renderResults()}
$('#language-toggle').onclick=()=>{const y=scrollY;language=language==='en'?'zh-Hant':'en';try{localStorage.setItem('wickerman-language',language)}catch{}renderLanguage();window.scrollTo({top:y,behavior:'instant'})};$('#filters').hidden=innerWidth<800;renderLanguage();
</script></body></html>
