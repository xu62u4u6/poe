function sourceItemName(item,v){return language==='zh-Hant'?partName(item):(item.drop?.variants[v.key]?.itemName||item.name)}
function variantLabel(item,v){if(item.drop&&v.key==='Base')return t('Normal');if(item.drop?.group==='Pinnacle Bosses'&&/^\d+$/.test(v.key))return t('Normal')+' '+v.key;return t(TYPES[v.key]||v.key)}
function sourceSearchTerms(item){const d=item.drop,l=item.locations;return [...(d?[d.bossEn,d.bossZh,d.group,t(d.group),...Object.values(d.variants).map(v=>v.itemName)]:[]),...(l?.campaign?[l.campaign.boss,l.campaign.zone,`Act ${l.campaign.act}`,`第${l.campaign.act}章`]:[]),...(l?.maps||[]).flatMap(m=>[m.boss,m.map,m.kind]),...(item.dropSources?.en||[]),...(item.dropSources?.zh||[])]}
function renderLocations(item){const zh=language==='zh-Hant',rows=item.dropSources?.[zh?'zh':'en']||[];if(!rows.length)return '';return `<div class="drop-locations" aria-label="${zh?'掉落位置':'Drop locations'}"><ul>${rows.map(row=>`<li>${esc(zh?row.replace(/^Act (\d+), /,'第 $1 章 · '):row)}</li>`).join('')}</ul><a class="drop-credit" href="https://poedb.tw/${zh?'tw':'us'}/${encodeURIComponent(item.poedbSlug)}" target="_blank" rel="noopener noreferrer">${zh?'掉落來源：流亡編年史':'Drop source: PoEDB'}</a></div>`}
function tradeLink(item,v){return `<a class="trade-link" href="${esc(v.tradeUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(partName(item)+' '+variantLabel(item,v)+' '+(language==='zh-Hant'?'購物搜尋':'Trade search'))}">${language==='zh-Hant'?(v.tradeExact?'購物':'購物・全版本'):(v.tradeExact?'Trade':'Trade · all')}</a>`}

function modifierText(v){return language==='zh-Hant'?v.zh:v.text}
function version(item){return item.variants.find(v=>v.key===versions[item.id])||item.variants[0]}
function rememberPosition(){if(currentView==='list')browsing[activeSlot]={query,tag:activeTag,scroll:scrollY,filtersOpen:!$('#filters').hidden};else configScroll=scrollY}
function restorePosition(){window.scrollTo({top:currentView==='list'?browsing[activeSlot].scroll:configScroll,behavior:'instant'})}
function setView(view){if(currentView===view)return;rememberPosition();currentView=view;document.body.dataset.view=view;renderNavigation();if(innerWidth<800)restorePosition()}
function renderNavigation(){$('#bottom-nav').innerHTML=[...SLOTS,['config','Loadout']].map(([key,label])=>`<button type="button" data-nav="${key}" ${((key==='config'&&currentView==='config')||(key===activeSlot&&currentView==='list'))?'aria-current="page"':''}>${t(label)}${key==='config'?`<span class="nav-count">${Object.keys(selected).length}/4</span>`:''}</button>`).join('');$('#bottom-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='config')setView('config');else setSlot(b.dataset.nav)})}
function renderSummary(){let count=0;$('#slots').innerHTML=SLOTS.map(([slot,label])=>{const item=ITEMS.find(i=>i.id===selected[slot]);if(item)count++;return `<div class="slot-row ${item?'has-item':''}"><div class="slot"><span class="slot-icon">${icon(item?item.primary:slot)}</span><div><button type="button" class="slot-label slot-edit" data-slot="${slot}" aria-label="${t('Choose ')}${t(label)}">${t(label)}${item?' · '+esc(variantLabel(item,version(item))):''}</button><p class="effect">${esc(item?modifierText(version(item)):t('Choose ')+t(label))}</p>${item?`<span class="item-name">${esc(sourceItemName(item,version(item)))}</span>`:''}</div></div>${item?`<button type="button" class="remove-slot" data-remove="${slot}" aria-label="${t('Remove ')}${t(label)}">${icon('close')}</button>`:''}</div>`}).join('');$('#selected-count').textContent=`${count} / 4`;renderNavigation();$('#clear-all').disabled=!count;
$('#slots').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{setSlot(b.dataset.slot);if(innerWidth>=800)$('#picker').scrollIntoView({block:'start',behavior:'instant'})});$('#slots').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const slot=b.dataset.remove;delete selected[slot];renderSummary();renderResults();$('#announcement').textContent=t('Removed ')+t(SLOTS.find(([s])=>s===slot)[1]);document.querySelector(`[data-slot="${slot}"]`).focus({preventScroll:true})});}
function renderTabs(){$('#tabs').innerHTML=SLOTS.map(([s,l])=>`<button type="button" data-tab="${s}" aria-pressed="${s===activeSlot}">${t(l)}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setSlot(b.dataset.tab));}
function renderFilters(){updateFilterButton();const tags=[...new Set(ITEMS.filter(i=>i.slot===activeSlot).flatMap(i=>i.tags))];const order=['Minions','Spells','Attacks','Lightning','Fire','Cold','Chaos','Life','Energy Shield','Mana','Attributes','Defence','Recovery','Speed','Totems','Damage','Physical','Movement','Cooldowns','Corpses','Rage','Area','Flasks','Loot','Warcries','Utility'];tags.sort((a,b)=>(order.includes(a)?order.indexOf(a):99)-(order.includes(b)?order.indexOf(b):99));$('#filters').innerHTML=['',...tags].map(tag=>`<button type="button" data-tag="${tag}" aria-pressed="${tag===activeTag}">${tag?icon(tag):''}${t(tag||'All')}</button>`).join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTag=b.dataset.tag;renderFilters();renderResults();$(`[data-tag="${activeTag}"]`).focus({preventScroll:true})})}
function renderResults(){const list=ITEMS.filter(i=>i.slot===activeSlot&&(!activeTag||i.tags.includes(activeTag))&&(!query||[i.name,i.nameZh,i.primary,t(i.primary),...i.tags,...i.tags.map(t),...sourceSearchTerms(i),...i.variants.flatMap(v=>[v.text,v.zh])].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||a.name.localeCompare(b.name));$('#result-count').textContent=language==='zh-Hant'?`${list.length} 個部件`:`${list.length} ${list.length===1?'part':'parts'}`;
if(!list.length){$('#results').innerHTML=`<div class="empty"><p>${t('No matching parts')}</p><button type="button" class="text-button" id="reset-filters">${t('Reset filters')}</button></div>`;$('#reset-filters').onclick=()=>{activeTag='';query='';$('#search').value='';renderFilters();renderResults()};return}
$('#results').innerHTML=list.map(i=>`<article class="part" data-id="${i.id}"><header class="part-header"><span class="category-icon" role="img" aria-label="${esc(t(i.primary))}">${icon(i.primary)}</span><div><h3>${esc(partName(i))}</h3></div></header>${renderLocations(i)}<div class="variants">${[...i.variants].sort((a,b)=>(RANK[a.key]??9)-(RANK[b.key]??9)).map(v=>{const on=selected[i.slot]===i.id&&versions[i.id]===v.key;return `<div class="variant" data-tier="${esc(v.key)}" data-selected="${on}" ${['Uber','Queen'].includes(v.key)?'data-special="true"':''}><span class="tier" title="${esc(sourceItemName(i,v))}">${esc(variantLabel(i,v))}</span><p class="modifier">${esc(modifierText(v))}</p><div class="variant-actions">${tradeLink(i,v)}<button type="button" class="choose-state" data-choose="${i.id}" data-key="${esc(v.key)}" aria-label="${t(on?'Deselect':'Select')} ${esc(sourceItemName(i,v))} ${esc(variantLabel(i,v))}" aria-pressed="${on}">${t(on?'Selected':'Select')}</button></div></div>`}).join('')}</div></article>`).join('');
$('#results').querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choose),b.dataset.key));$('#results').querySelectorAll('.variant').forEach(row=>{let start=null,moved=false,beforeClick=null;row.onpointerdown=e=>{start=[e.clientX,e.clientY];moved=false};row.onpointerup=e=>{if(start)moved=Math.hypot(e.clientX-start[0],e.clientY-start[1])>5};row.onpointercancel=()=>{moved=true};row.onclick=e=>{if(e.target.closest('button,a')||moved)return;const selection=window.getSelection(),button=row.querySelector('[data-choose]'),id=Number(button.dataset.choose),item=ITEMS.find(i=>i.id===id);if(selection&&!selection.isCollapsed){if(e.detail===2&&beforeClick){if(beforeClick.selected===undefined)delete selected[item.slot];else selected[item.slot]=beforeClick.selected;if(beforeClick.version===undefined)delete versions[id];else versions[id]=beforeClick.version;renderSummary();syncChoices();beforeClick=null}return}if(e.detail>2)return;beforeClick={selected:selected[item.slot],version:versions[id]};choose(id,button.dataset.key,false)}});}
function updateFilterButton(){$('#filter-count').textContent=activeTag?' · '+t(activeTag):'';$('#filter-toggle').setAttribute('aria-expanded',String(!$('#filters').hidden))}
function setSlot(slot){if(slot===activeSlot&&currentView==='list')return;rememberPosition();activeSlot=slot;currentView='list';document.body.dataset.view='list';const state=browsing[slot];activeTag=state.tag;query=state.query;$('#search').value=query;$('#filters').hidden=!state.filtersOpen;renderTabs();renderFilters();renderResults();renderNavigation();restorePosition()}
function syncChoices(){$('#results').querySelectorAll('[data-choose]').forEach(button=>{const id=Number(button.dataset.choose),item=ITEMS.find(i=>i.id===id),on=selected[item.slot]===id&&versions[id]===button.dataset.key;button.setAttribute('aria-pressed',on);button.textContent=t(on?'Selected':'Select');button.setAttribute('aria-label',t(on?'Deselect':'Select')+' '+sourceItemName(item,item.variants.find(v=>v.key===button.dataset.key))+' '+variantLabel(item,item.variants.find(v=>v.key===button.dataset.key)));button.closest('.variant').dataset.selected=on})}
function choose(id,key,focusButton=true){const item=ITEMS.find(i=>i.id===id);const remove=selected[item.slot]===id&&versions[id]===key;if(remove)delete selected[item.slot];else{selected[item.slot]=id;versions[id]=key}renderSummary();syncChoices();if(focusButton)document.querySelector(`[data-choose="${id}"][data-key="${key}"]`)?.focus({preventScroll:true});$('#announcement').textContent=t(remove?'Deselected':'Selected')+' '+sourceItemName(item,version(item))+' '+variantLabel(item,version(item));}
$('#search').oninput=e=>{query=e.target.value;renderResults()};$('#filter-toggle').onclick=()=>{$('#filters').hidden=!$('#filters').hidden;updateFilterButton()};$('#clear-all').onclick=()=>{for(const key of Object.keys(selected))delete selected[key];renderSummary();renderResults();$('#announcement').textContent=t('Loadout cleared');(innerWidth<800?document.querySelector('[data-nav="config"]'):document.querySelector('[data-slot]')).focus({preventScroll:true})};function renderLanguage(){document.documentElement.lang=language;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#close-help').setAttribute('aria-label',t('Close help'));$('#loadout-label').textContent=t('Loadout');$('#clear-all').textContent=t('Clear');$('#search').placeholder=t('Search parts or effects');$('#search').setAttribute('aria-label',t('Search parts or effects'));$('#filter-toggle').firstChild.nodeValue=t('Filter');$('#bottom-nav').setAttribute('aria-label',t('Slots and loadout'));$('#picker').setAttribute('aria-label',t('Parts'));$('#configuration').setAttribute('aria-label',t('Loadout'));$('#tabs').setAttribute('aria-label',t('Slots'));$('#filters').setAttribute('aria-label',t('Categories'));$('#source-label').textContent='Source:';$('#source-link').textContent='PoEDB';$('#author-label').textContent='Author: Dion';const target=language==='en'?'Switch to Traditional Chinese':'切換為英文';$('#language-toggle').setAttribute('aria-label',target);$('#language-toggle').title=target;renderSummary();renderTabs();renderFilters();renderResults()}
const chromeObserver=new ResizeObserver(()=>document.documentElement.style.setProperty('--chrome-height',innerWidth<800?$('#mobile-chrome').getBoundingClientRect().height+'px':'0px'));chromeObserver.observe($('#mobile-chrome'));
$('#help-button').onclick=()=>$('#help-dialog').showModal();$('#close-help').onclick=()=>{$('#help-dialog').close();$('#help-button').focus({preventScroll:true})};$('#help-dialog').onclick=e=>{if(e.target===$('#help-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#help-dialog').close()}};
$('#language-toggle').onclick=()=>{const y=scrollY;language=language==='en'?'zh-Hant':'en';try{localStorage.setItem('wickerman-language',language)}catch{}renderLanguage();const url=new URL(location.href);url.searchParams.set('lang',language);history.replaceState(null,'',url);window.scrollTo({top:y,behavior:'instant'})};$('#filters').hidden=innerWidth<800;renderLanguage();
</script></body></html>
